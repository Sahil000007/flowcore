spring.application.name=flowcore-backend

# ===============================
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}
server.servlet.context-path=

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/flowcore_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&autoReconnect=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.seed-demo-users=${SEED_DEMO_USERS:true}

# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=${JWT_SECRET:FlowCore_JWT_Secret_Key_2026_Contractor_Management_System_Production_Grade}
jwt.expiration=86400000

# ===============================
# LOGGING CONFIGURATION
# ===============================
logging.level.root=INFO
logging.level.com.flowcore=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# ===============================
# CORS CONFIGURATION
# ===============================
server.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ===============================
# OPTIONAL PAYMENT CONFIGURATION
# ===============================
stripe.secret.key=${STRIPE_SECRET_KEY:}
frontend.url=${FRONTEND_URL:http://localhost:5173}
